spring.application.name=BolsaTrabajo_BE

# Configuración de base de datos MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/${DB_NAME:oficina_empleo_sanjose}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de Hibernate y JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Puerto de la aplicación
server.port=8080

# Seguridad JWT, SuperAdmin y CORS
app.security.jwt.secret=${JWT_SECRET:}
app.security.superadmin.password=${SUPERADMIN_PASSWORD:}
app.security.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173}

# Swagger/OpenAPI — deshabilitar en producción
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

