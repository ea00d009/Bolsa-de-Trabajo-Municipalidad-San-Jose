spring.application.name=BolsaTrabajo_BE_Test
spring.datasource.url=jdbc:mysql://localhost:3306/${DB_NAME:oficina_empleo_sanjose}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
app.security.jwt.secret=${JWT_SECRET:claveDePruebaSeguraParaTestsUnitariosEIntegracion123456}
app.security.cors.allowed-origins=http://localhost:5173
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
