services:
  mysql:
    image: mysql:8.0
    container_name: bolsa_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-}
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: ${DB_NAME:-oficina_empleo_sanjose}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/BD_oficinadeempleo.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bolsa_backend
    restart: always
    environment:
      - spring.datasource.url=jdbc:mysql://mysql:3306/${DB_NAME:-oficina_empleo_sanjose}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - DB_NAME=${DB_NAME:-oficina_empleo_sanjose}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-}
      - JWT_SECRET=${JWT_SECRET:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost,http://localhost:5173,http://localhost:80}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bolsa_frontend
    restart: always
    ports:
      - "5173:80"
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
