name: CI - Bolsa de Trabajo San José

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security-audit:
    name: Auditoría de Secretos y Datos Sensibles (PII)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Verificar que no existan archivos sensibles versionados
        run: |
          if git ls-files | grep -E '\.(csv|xlsx|xls)$|(^|/)\.env$'; then
            echo "ERROR: Se detectaron archivos sensibles (.env / .csv / .xlsx) en el repositorio."
            exit 1
          fi
          if grep -riE "INSERT INTO `?ciudadanos`?" database/ *.sql 2>/dev/null; then
            echo "ERROR: Se detectaron volcados de datos reales (ciudadanos) en archivos SQL versionados."
            exit 1
          fi
          echo "Auditoría de privacidad y secretos OK."

  backend-ci:
    name: Backend (Java 21 + Spring Boot + Tests)
    runs-on: ubuntu-latest
    needs: security-audit
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: oficina_empleo_sanjose
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Inicializar esquema limpio en MySQL
        run: |
          mysql -h 127.0.0.1 -u root oficina_empleo_sanjose < database/BD_oficinadeempleo.sql

      - name: Compilar y ejecutar suite de pruebas (JUnit 5)
        working-directory: ./backend
        env:
          DB_NAME: oficina_empleo_sanjose
          DB_USERNAME: root
          DB_PASSWORD: ""
          JWT_SECRET: claveDePruebaSeguraParaTestsUnitariosEIntegracion123456
        run: |
          chmod +x mvnw
          ./mvnw test -B

  frontend-ci:
    name: Frontend (React 19 + TypeScript + Vite Build)
    runs-on: ubuntu-latest
    needs: security-audit
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias y validar Build de Producción
        working-directory: ./frontend
        run: |
          npm ci
          npm run build
